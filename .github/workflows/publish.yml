name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build N-API addon (release)
        run: cargo build -p htsvcf-napi --release --target ${{ matrix.target }}

      - name: Copy addon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cp -f target/${{ matrix.target }}/release/libhtsvcf_napi.so artifacts/htsvcf.node
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            cp -f target/${{ matrix.target }}/release/libhtsvcf_napi.dylib artifacts/htsvcf.node
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.artifact }}
          path: artifacts/htsvcf.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    # Required for OIDC trusted publishing
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-linux-x64
          path: npm/htsvcf/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: |
          cd npm/htsvcf
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version

      - name: Publish to npm
        run: npm -C npm/htsvcf publish --provenance --access public
