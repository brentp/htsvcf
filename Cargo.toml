[workspace]
resolver = "2"
members = [
  "crates/htsvcf",
  "crates/htsvcf-core",
  "crates/htsvcf-napi",
]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# upgrade rust-htslib to 0.52.0 once rust-htslib#499 is merged and new tag is made.
rust-htslib = { version = "0.48.0", features = ["libdeflate"]}
v8 = "142.2.0"
serde_v8 = "0.285.0"


[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
